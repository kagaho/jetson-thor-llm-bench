<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1059" role="img" aria-labelledby="title desc">
<title id="title">B2 versus FP8 hybrid: throughput and outcomes</title>
<desc id="desc">One host and finite runs. The throughput test does not establish output correctness. Values are printed next to every bar; missing values are marked n/a.</desc>
