<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 989" role="img" aria-labelledby="title desc">
<title id="title">B2 versus FP8 hybrid: response latency</title>
<desc id="desc">Lower latency alone does not establish equal work, quality or cache-hit attribution. Values are printed next to every bar; missing values are marked n/a.</desc>
<rect width="1000" height="989" rx="20" fill="#102033"/>
<style>text{font-family:Arial,sans-serif;fill:#e8f1fb}.muted{fill:#aabed3}</style>
<text x="34" y="46" font-size="25" font-weight="700">B2 versus FP8 hybrid: response latency</text>
<text x="34" y="73" font-size="14" class="muted">Same benchmark protocols; checkpoint, runtime and serving features differ.</text>
<rect x="34" y="96" width="18" height="13" rx="3" fill="#38bdf8"/>
<text x="61" y="108" font-size="14">B2 / NVIDIA NVFP4</text>
<rect x="354" y="96" width="18" height="13" rx="3" fill="#fbbf24"/>
<text x="381" y="108" font-size="14">H2 / FP8 hybrid, 4 GiB KV</text>
<rect x="24" y="132" width="952" height="300" rx="14" fill="#192e45"/>
<text x="44" y="162" font-size="19" font-weight="700">Median task/request latency</text>
<text x="44" y="185" font-size="12" class="muted">All recorded task outcomes, including failures; duration also depends on generated tokens and tool turns.</text>
<line x1="285.0" y1="200" x2="285.0" y2="409" stroke="#29445e"/>
<text x="285.0" y="424" font-size="11" text-anchor="middle" class="muted">0.0</text>
<line x1="418.75" y1="200" x2="418.75" y2="409" stroke="#29445e"/>
<text x="418.75" y="424" font-size="11" text-anchor="middle" class="muted">5.0</text>
<line x1="552.5" y1="200" x2="552.5" y2="409" stroke="#29445e"/>
<text x="552.5" y="424" font-size="11" text-anchor="middle" class="muted">9.9</text>
<line x1="686.25" y1="200" x2="686.25" y2="409" stroke="#29445e"/>
<text x="686.25" y="424" font-size="11" text-anchor="middle" class="muted">14.9</text>
<line x1="820.0" y1="200" x2="820.0" y2="409" stroke="#29445e"/>
<text x="820.0" y="424" font-size="11" text-anchor="middle" class="muted">19.8</text>
<text x="44" y="230" font-size="14">First tool decision</text>
<rect x="285" y="212" width="78.92" height="16" rx="3" fill="#38bdf8"/>
<text x="372.92" y="225" font-size="12">2.92 s</text>
<rect x="285" y="236" width="49.24" height="16" rx="3" fill="#fbbf24"/>
<text x="343.24" y="249" font-size="12">1.82 s</text>
<text x="44" y="300" font-size="14">Fixed multi-turn</text>
<rect x="285" y="282" width="333.44" height="16" rx="3" fill="#38bdf8"/>
<text x="627.44" y="295" font-size="12">12.36 s</text>
<rect x="285" y="306" width="167.99" height="16" rx="3" fill="#fbbf24"/>
<text x="461.99" y="319" font-size="12">6.22 s</text>
<text x="44" y="370" font-size="14">Seeded workflows</text>
<rect x="285" y="352" width="477.68" height="16" rx="3" fill="#38bdf8"/>
<text x="771.68" y="365" font-size="12">17.70 s</text>
<rect x="285" y="376" width="246.43" height="16" rx="3" fill="#fbbf24"/>
<text x="540.43" y="389" font-size="12">9.13 s</text>
<rect x="24" y="446" width="952" height="440" rx="14" fill="#192e45"/>
<text x="44" y="476" font-size="19" font-weight="700">Median time to first streamed token</text>
<text x="44" y="499" font-size="12" class="muted">Quick: three runs. Prefix groups: five pairs; fresh markers differ across deployments.</text>
<line x1="285.0" y1="514" x2="285.0" y2="863" stroke="#29445e"/>
<text x="285.0" y="878" font-size="11" text-anchor="middle" class="muted">0.0</text>
<line x1="418.75" y1="514" x2="418.75" y2="863" stroke="#29445e"/>
<text x="418.75" y="878" font-size="11" text-anchor="middle" class="muted">1.3</text>
<line x1="552.5" y1="514" x2="552.5" y2="863" stroke="#29445e"/>
<text x="552.5" y="878" font-size="11" text-anchor="middle" class="muted">2.5</text>
<line x1="686.25" y1="514" x2="686.25" y2="863" stroke="#29445e"/>
<text x="686.25" y="878" font-size="11" text-anchor="middle" class="muted">3.8</text>
<line x1="820.0" y1="514" x2="820.0" y2="863" stroke="#29445e"/>
<text x="820.0" y="878" font-size="11" text-anchor="middle" class="muted">5.0</text>
<text x="44" y="544" font-size="14">Quick response</text>
<rect x="285" y="526" width="27.44" height="16" rx="3" fill="#38bdf8"/>
<text x="321.44" y="539" font-size="12">0.26 s</text>
<rect x="285" y="550" width="28.81" height="16" rx="3" fill="#fbbf24"/>
<text x="322.81" y="563" font-size="12">0.27 s</text>
<text x="44" y="614" font-size="14">Prefix: first</text>
<rect x="285" y="596" width="452.55" height="16" rx="3" fill="#38bdf8"/>
<text x="746.55" y="609" font-size="12">4.24 s</text>
<rect x="285" y="620" width="314.08" height="16" rx="3" fill="#fbbf24"/>
<text x="608.08" y="633" font-size="12">2.94 s</text>
<text x="44" y="684" font-size="14">Prefix: repeat</text>
<rect x="285" y="666" width="56.11" height="16" rx="3" fill="#38bdf8"/>
<text x="350.11" y="679" font-size="12">0.53 s</text>
<rect x="285" y="690" width="89.32" height="16" rx="3" fill="#fbbf24"/>
<text x="383.32" y="703" font-size="12">0.84 s</text>
<text x="44" y="754" font-size="14">Agent prefix: first</text>
<rect x="285" y="736" width="477.68" height="16" rx="3" fill="#38bdf8"/>
<text x="771.68" y="749" font-size="12">4.48 s</text>
<rect x="285" y="760" width="357.66" height="16" rx="3" fill="#fbbf24"/>
<text x="651.66" y="773" font-size="12">3.35 s</text>
<text x="44" y="824" font-size="14">Agent prefix: follow-up</text>
<rect x="285" y="806" width="67.43" height="16" rx="3" fill="#38bdf8"/>
<text x="361.43" y="819" font-size="12">0.63 s</text>
<rect x="285" y="830" width="91.76" height="16" rx="3" fill="#fbbf24"/>
<text x="385.76" y="843" font-size="12">0.86 s</text>
<text x="34" y="959" font-size="12" class="muted">Lower latency alone does not establish equal work, quality or cache-hit attribution.</text>
</svg>
