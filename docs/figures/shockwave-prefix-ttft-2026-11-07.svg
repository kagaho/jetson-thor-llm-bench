<svg xmlns="http://www.w3.org/2000/svg" width="960" height="428" viewBox="0 0 960 428" role="img" aria-labelledby="title description">
<title id="title">Shockwave first versus repeated prompt time to first token</title>
<desc id="description">Two observed first/repeat prompt pairs. First requests took 4.771 and 4.322 seconds, repeated requests 0.553 and 0.536 seconds. Cache hits unverified.</desc>
<rect width="960" height="428" rx="18" fill="#F8FAFC"/>
<text x="36" y="47" font-family="sans-serif" font-weight="700" font-size="24" fill="#102A43">Shockwave · first-token latency</text>
<text x="36" y="73" font-family="sans-serif" font-size="14" fill="#526477">Two independent first/repeat pairs · ~6,082 prompt tokens each · lower is better</text>
<rect x="754" y="18" width="166" height="66" rx="12" fill="#DBEAFE"/>
<text x="774" y="50" font-family="sans-serif" font-size="28" font-weight="800" fill="#1D4ED8">8.35×</text>
<text x="774" y="70" font-family="sans-serif" font-size="12" fill="#1E40AF">Median paired ratio</text>
<rect x="36" y="99" width="13" height="13" rx="2" fill="#315E98"/>
<text x="56" y="110" font-family="sans-serif" font-size="13" fill="#334155">First prompt</text>
<rect x="184" y="99" width="13" height="13" rx="2" fill="#0D9488"/>
<text x="204" y="110" font-family="sans-serif" font-size="13" fill="#334155">Repeated prompt</text>
<text x="36" y="178" font-family="sans-serif" font-weight="700" font-size="16" fill="#102A43">Run 1</text>
<text x="36" y="197" font-family="sans-serif" font-size="12" fill="#64748B">6,083 tokens</text>
<rect x="166" y="156" width="596.41" height="28" rx="6" fill="#315E98"/>
<text x="772.4" y="176" font-family="sans-serif" font-size="14" font-weight="700" fill="#102A43">4.771s</text>
<rect x="166" y="193" width="69.09" height="28" rx="6" fill="#0D9488"/>
<text x="245.1" y="213" font-family="sans-serif" font-size="14" font-weight="700" fill="#102A43">0.553s</text>
<text x="36" y="292" font-family="sans-serif" font-weight="700" font-size="16" fill="#102A43">Run 2</text>
<text x="36" y="311" font-family="sans-serif" font-size="12" fill="#64748B">6,082 tokens</text>
<rect x="166" y="270" width="540.29" height="28" rx="6" fill="#315E98"/>
<text x="716.3" y="290" font-family="sans-serif" font-size="14" font-weight="700" fill="#102A43">4.322s</text>
<rect x="166" y="307" width="67.04" height="28" rx="6" fill="#0D9488"/>
<text x="243.0" y="327" font-family="sans-serif" font-size="14" font-weight="700" fill="#102A43">0.536s</text>
<line x1="166" y1="371" x2="792" y2="371" stroke="#CBD5E1" stroke-width="2"/>
<line x1="166" y1="368" x2="166" y2="377" stroke="#94A3B8"/>
<text x="166" y="394" font-family="sans-serif" text-anchor="middle" font-size="12" fill="#526477">0s</text>
<line x1="291" y1="368" x2="291" y2="377" stroke="#94A3B8"/>
<text x="291" y="394" font-family="sans-serif" text-anchor="middle" font-size="12" fill="#526477">1s</text>
<line x1="416" y1="368" x2="416" y2="377" stroke="#94A3B8"/>
<text x="416" y="394" font-family="sans-serif" text-anchor="middle" font-size="12" fill="#526477">2s</text>
<line x1="541" y1="368" x2="541" y2="377" stroke="#94A3B8"/>
<text x="541" y="394" font-family="sans-serif" text-anchor="middle" font-size="12" fill="#526477">3s</text>
<line x1="666" y1="368" x2="666" y2="377" stroke="#94A3B8"/>
<text x="666" y="394" font-family="sans-serif" text-anchor="middle" font-size="12" fill="#526477">4s</text>
<line x1="791" y1="368" x2="791" y2="377" stroke="#94A3B8"/>
<text x="791" y="394" font-family="sans-serif" text-anchor="middle" font-size="12" fill="#526477">5s</text>
<text x="36" y="417" font-family="sans-serif" font-size="13" font-weight="600" fill="#9A3412">TTFT speedup does not prove KV-cache hits. cached_tokens was unavailable in both runs.</text>
</svg>
