<text x="816" y="179" fill="#A9EEE6" font-size="17" font-family="Arial, sans-serif">0.51s</text>
<text x="28" y="254" fill="#EAF1FA" font-size="18" font-family="Arial, sans-serif">Agent-style · TTFT</text>
<rect x="260" y="221" width="540" height="17" rx="4" fill="#26394F"/>
<rect x="260" y="249" width="540" height="17" rx="4" fill="#26394F"/>
