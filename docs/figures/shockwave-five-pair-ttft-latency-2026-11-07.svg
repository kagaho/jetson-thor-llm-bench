<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 970 540">
<title id="title">Shockwave five-pair inference latency comparison</title>
<desc id="desc">Median time to first token and end-to-end latency in seconds for first versus follow-up requests, five pairs each. Prefix first TTFT 4.20s repeat 0.51s; agent first TTFT 4.52s follow-up 0.63s. Prefix total 6.98s versus 3.36s; agent total 10.36s versus 7.41s.</desc>
<rect x="0" y="0" width="970" height="540" rx="16" fill="#111D2C"/>
<text x="28" y="45" fill="#FFFFFF" font-size="28" font-family="Arial, sans-serif" font-weight="bold">Shockwave · Five-pair responsiveness</text>
<text x="28" y="77" fill="#ADBFD1" font-size="17" font-family="Arial, sans-serif">Jetson AGX Thor · Qwen3.8 Flash Next NVFP4 · lower latency is better</text>
<rect x="28" y="97" width="16" height="16" rx="3" fill="#5F91F3"/>
<text x="52" y="111" fill="#D9E6F8" font-size="16" font-family="Arial, sans-serif">First request</text>
<rect x="224" y="97" width="16" height="16" rx="3" fill="#31C7B7"/>
