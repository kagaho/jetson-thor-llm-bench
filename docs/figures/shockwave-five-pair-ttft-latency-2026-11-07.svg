<text x="28" y="354" fill="#EAF1FA" font-size="18" font-family="Arial, sans-serif">Identical prefix · Total</text>
<rect x="260" y="321" width="540" height="17" rx="4" fill="#26394F"/>
<rect x="260" y="349" width="540" height="17" rx="4" fill="#26394F"/>
