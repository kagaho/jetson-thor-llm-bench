<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 515" role="img" aria-labelledby="title desc">
<title id="title">Shockwave baseline A versus experimental B2</title>
<desc id="desc">Available RAM: A 1.1 GiB, B2 2.9 GiB. Median tool-decision latency: A 2.9165 seconds, B2 3.1947 seconds. Differences are not all causally attributable to KV cache sizing.</desc>
<rect width="940" height="515" rx="18" fill="#122032"/>
<text x="28" y="49" fill="#FFFFFF" font-size="28" font-family="Arial, sans-serif" font-weight="bold">Shockwave · KV-cache A/B2</text>
<text x="28" y="82" fill="#B7C6DB" font-size="17" font-family="Arial, sans-serif">Same model and image · different KV cache, startup threshold and context</text>
<rect x="29" y="102" width="16" height="16" fill="#729AF8" rx="3"/>
<text x="54" y="116" fill="#E7EEF8" font-size="16" font-family="Arial, sans-serif">A · automatic KV</text>
<rect x="258" y="102" width="16" height="16" fill="#31C9BC" rx="3"/>
<text x="283" y="116" fill="#E7EEF8" font-size="16" font-family="Arial, sans-serif">B2 · 4 GiB KV</text>
<text x="28" y="154" fill="#FFFFFF" font-size="21" font-family="Arial, sans-serif">Available RAM (GiB)</text>
<text x="730" y="154" fill="#B7C6DB" font-size="16" font-family="Arial, sans-serif">Higher is better</text>
<rect x="28" y="172" width="760" height="22" rx="5" fill="#293950"/>
<rect x="28" y="172" width="238.86" height="22" rx="5" fill="#729AF8"/>
<text x="806" y="190" fill="#EAF1FA" font-size="18" font-family="Arial, sans-serif">1.1</text>
<rect x="28" y="205" width="760" height="22" rx="5" fill="#293950"/>
<rect x="28" y="205" width="629.71" height="22" rx="5" fill="#31C9BC"/>
<text x="806" y="223" fill="#EAF1FA" font-size="18" font-family="Arial, sans-serif">2.9</text>
<text x="28" y="319" fill="#FFFFFF" font-size="21" font-family="Arial, sans-serif">Median tool-decision latency (s)</text>
<text x="730" y="319" fill="#B7C6DB" font-size="16" font-family="Arial, sans-serif">Lower is better</text>
<rect x="28" y="337" width="760" height="22" rx="5" fill="#293950"/>
<rect x="28" y="337" width="615.71" height="22" rx="5" fill="#729AF8"/>
<text x="806" y="355" fill="#EAF1FA" font-size="18" font-family="Arial, sans-serif">2.92</text>
<rect x="28" y="370" width="760" height="22" rx="5" fill="#293950"/>
<rect x="28" y="370" width="674.44" height="22" rx="5" fill="#31C9BC"/>
<text x="806" y="388" fill="#EAF1FA" font-size="18" font-family="Arial, sans-serif">3.19</text>
<text x="28" y="480" fill="#AABDD4" font-size="15" font-family="Arial, sans-serif">A: 213K context / 5.26 GiB cache · B2: 131K context / 4 GiB cache · 30/30 routing passes each</text>
</svg>
