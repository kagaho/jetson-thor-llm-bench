name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax compile
        run: python -m compileall -q thorbench tests
      - name: Offline unit tests (no GPU required)
        run: python -m unittest discover -s tests -v
